# cargo-deny configuration.
# Run locally with `cargo deny check`; mirrors the policy applied in CI.

[graph]
all-features = false

[advisories]
# `cargo audit` does the primary vulnerability check; deny's advisory pass
# is a backup and intentionally lenient by default.
ignore = []

[licenses]
# Standard permissive OSS licences and the few "mostly permissive" SPDX
# identifiers we encounter in the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

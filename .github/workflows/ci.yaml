name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for the coverage comment
    steps:
      # Actions are pinned by commit SHA per the project's policy.
      # The trailing comment is the major-version tag Dependabot tracks
      # against; Dependabot will keep the SHA in sync with that tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39  # v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-deny

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo nextest run --all

      - run: cargo llvm-cov nextest --lcov --output-path lcov.info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: lcov
          path: lcov.info

      # Coverage delta is informational; reviewers enforce "tests for new code".
      - uses: romeovs/lcov-reporter-action@87a815f34ec27a5826abba44ce09bbc688da58fd  # v0.4.0
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./lcov.info

      - run: cargo audit

      - run: cargo deny check

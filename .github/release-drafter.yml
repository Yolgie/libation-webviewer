name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels: ["feature", "enhancement"]
  - title: "Fixes"
    labels: ["fix", "bug"]
  - title: "Docs"
    labels: ["docs", "documentation"]
  - title: "Dependencies"
    labels: ["dependencies"]
  - title: "Internal"
    labels: ["chore", "refactor", "ci"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
no-changes-template: "- No user-facing changes."

template: |
  ## Changes

  $CHANGES

version-resolver:
  major:
    labels: ["major"]
  minor:
    labels: ["minor", "feature", "enhancement"]
  patch:
    labels: ["patch", "fix", "bug", "dependencies"]
  default: patch

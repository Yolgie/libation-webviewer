# SonarQube Cloud configuration. Picked up by the scan action invoked
# from .github/workflows/sonar.yaml; not consumed at runtime.

sonar.projectKey=Yolgie_libation-webviewer
sonar.organization=yolgie

sonar.projectName=libation-webviewer

# Layout: Rust crate at the repo root, sources in src/, integration
# tests in tests/. SonarCloud has native Rust support — no toolchain
# config needed here.
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Keep generated/binary/asset artefacts out of the analysis surface.
# `target/` is Cargo's build output; `tests/fixtures/` holds binary
# audio + SQLite blobs; `assets/` is the placeholder SVG.
sonar.exclusions=target/**,tests/fixtures/**,assets/**

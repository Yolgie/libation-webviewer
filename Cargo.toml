[package]
name = "libation-webviewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Small self-hosted web viewer for a Dockerized Libation audiobook library."
license = "MIT"
repository = "https://github.com/yolgie/libation-webviewer"
readme = "README.md"
publish = false

[dependencies]
# HTTP
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }   # ReaderStream for streamed downloads
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-br", "set-header"] }

# Templates
askama = "0.16"

# Static assets embedded into the binary
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Persistence
# rusqlite pinned to 0.39 to match r2d2_sqlite 0.34's hard rusqlite dep.
# Bump together when r2d2_sqlite ships a release tracking rusqlite 0.40.
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"

# Cover extraction
mp4ameta = "0.13"
id3 = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
subtle = "2"                                       # constant-time password compare
uuid = { version = "1", features = ["v4", "fast-rng"] }

# HMAC for signed session cookies (pairs with sha2 below).
hmac = "0.13"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
bytes = "1"
regex = "1"
sha2 = "0.11"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
reqwest = { version = "0.13", features = ["json"], default-features = false, optional = false }
insta = "1"
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot for handler tests

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
